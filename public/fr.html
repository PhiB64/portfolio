<!doctype html>
<!--
  Redirection de l'ancienne URL française `/fr` vers la racine, `/`.

  Pourquoi ce fichier existe. Le français est passé de `/fr` à la racine quand
  il est devenu la langue par défaut. Les URL `/fr` sont pourtant déjà partagées,
  indexées et citées : sans cette page, tous ces liens tomberaient sur une 404.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Philippe Barbosa — Concepteur Développeur</title>
    <link rel="canonical" href="https://phib64.github.io/portfolio/" />
    <meta http-equiv="refresh" content="0; url=/portfolio/" />
    <noscript>
      <meta http-equiv="refresh" content="0; url=/portfolio/" />
      <p>Cette page a été déplacée vers <a href="/portfolio/">phib64.github.io/portfolio</a>.</p>
    </noscript>
  </head>
  <body>
    <p>Cette page a été déplacée vers <a href="/portfolio/">phib64.github.io/portfolio</a>.</p>
  </body>
</html>
