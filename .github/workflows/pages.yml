name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # La version *minimale* supportée (`engines.node` : >=20.9), pas celle
          # du poste de développement. Tester sur le plancher plutôt que sur le
          # plafond est ce qui attrape l'usage accidentel d'une API plus récente :
          # un `structuredClone` ou un `Array.at` passe en local sur Node 22 et
          # casse ici. Un `20` sans décimale suit la dernière 20.x, donc le
          # plancher déclaré reste vrai au fil des patchs.
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Le lint et les tests bloquent le déploiement.
      #
      # La raison écrite jusqu'ici — « un portfolio doit rester en ligne même
      # quand une passe de vérification échoue » — ne justifiait pas
      # `continue-on-error`, et tenait un raisonnement faux. GitHub Pages sert le
      # dernier déploiement *réussi* : un workflow interrompu laisse donc la
      # version précédente en ligne. Bloquer n'a jamais pris le site hors ligne.
      #
      # Ce que `continue-on-error` faisait, à l'inverse, était de déployer la
      # version qui venait d'échouer aux tests — donc de remplacer un site sain
      # par un site dont la suite de tests sait quelque chose de faux. Le pire
      # des deux mondes : le risque réel est multiplié, et la protection
      # imaginée ne s'appuyait sur aucun mécanisme.
      #
      # Le coût restant est le test instable, qui bloquerait un déploiement
      # légitime. Il n'y en a pas ici : la suite est du `node` et du `jsdom`,
      # sans réseau ni horloge murale.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          # Racine publique du site (canonique, Open Graph, JSON-LD, sitemap).
          # Sans elle, `app/layout.js` retombe sur `https://phib64.github.io`
          # (domaine nu, sans `/portfolio`), et la canonique pointe hors site.
          NEXT_PUBLIC_SITE_URL: https://phib64.github.io
          # Valeur publique par construction : le préfixe NEXT_PUBLIC_ la lit à
          # la compilation et elle finit dans le bundle client, où n'importe qui
          # peut la lire. La garder dans `secrets` n'ajoute aucune
          # confidentialité — c'est la même valeur que celle en dur par défaut
          # dans components/contact-overlay.jsx.
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          # URL publique du Worker proxy du chatbot. Comme pour Formspree, elle
          # finit dans le bundle client. Le Worker garde la clé OpenRouter dans
          # un secret Cloudflare, donc cette URL n'expose rien : elle ne donne
          # accès qu'à un proxy déjà protégé (rate limiting, CORS, validation).
          NEXT_PUBLIC_CHAT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}

      # Le digest `content.json` est la seule source de vérité du chatbot
      # (voir `scripts/build-chat-content.mjs`) : un build qui l'oublie livre
      # un site dont le chat répond en boucle « indisponible ». On échoue ici
      # plutôt que de déployer un site muet.
      - name: Check chat digest
        run: test -f dist/content.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
