name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          # Valeur publique par construction : le préfixe NEXT_PUBLIC_ la lit à
          # la compilation et elle finit dans le bundle client, où n'importe qui
          # peut la lire. La garder dans `secrets` n'ajoute aucune
          # confidentialité — c'est la même valeur que celle en dur par défaut
          # dans components/contact-overlay.jsx.
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          # URL publique du Worker proxy du chatbot. Comme pour Formspree, elle
          # finit dans le bundle client. Le Worker garde la clé OpenRouter dans
          # un secret Cloudflare, donc cette URL n'expose rien : elle ne donne
          # accès qu'à un proxy déjà protégé (rate limiting, CORS, validation).
          NEXT_PUBLIC_CHAT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
